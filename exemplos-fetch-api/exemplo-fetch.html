<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Fetch API</title>
</head>
<body>
    <h1>Exemplo Fetch API</h1>
    <p>OBS: RODAR COM EXTENSÃO LIVE SERVER DO VS CODE PARA FUNCIONAR</p>
    <button id="btnExecutar">Executar Fetch</button>
    <div id="resultados"></div>
    <script>
        async function carregarDados() {

            try {
                const httpResp = await fetch('exemplo.json');
                if (!httpResp.ok) {
                    alert('Erro na requisição do Fetch API');
                    return;
                }
                const dados = await httpResp.json();

                let nome = dados.nome;
                let valor = dados.valor;

                let itens = '';
                for (let i = 0; i < dados.propriedades.length; i++) {
                    let itemLi = '<li>' + dados.propriedades[i] + '</li>';
                    itens = itens + itemLi;
                }

                document.getElementById('resultados').innerHTML = `
                    <h2>${nome}</h2>
                    <p>Valor: ${valor}</p>
                    <div>Propriedades:
                        <ul>
                            ${itens}
                        </ul>
                    </div>
                `;

            } catch(err) {
                alert('Erro no processamento do Fetch API - ' + err)
            }

        }
        document.getElementById('btnExecutar')
            .addEventListener('click', carregarDados);

    </script>
</body>
</html>
